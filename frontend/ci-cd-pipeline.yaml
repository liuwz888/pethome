# PetHome CI/CD Pipeline Configuration
# GitHub Actions workflow for automated deployment

name: PetHome CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pethome-platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java
      if: matrix.service == 'backend'
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node.js
      if: matrix.service == 'frontend'
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.m2/repository
          node_modules
        key: ${{ runner.os }}-${{ matrix.service }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.service }}-

    - name: Build Backend
      if: matrix.service == 'backend'
      run: |
        cd backend
        mvn clean compile -DskipTests
        mvn test

    - name: Build Frontend
      if: matrix.service == 'frontend'
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Security Scan
      uses: github/codeql-action/analyze@v2
      with:
        category: "language-agnostic"

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=sha

    - name: Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}-frontend
        labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Deploy to Staging
      uses: azure/k8s-deploy@v3
      with:
        namespace: pethome-staging
        manifests: |
          k8s-deployment.yaml
        images: |
          ghcr.io/${{ github.repository }}/pethome-backend:latest
          ghcr.io/${{ github.repository }}/pethome-frontend:latest
        imagepullsecrets: |
          ghcr.io

    - name: Run Integration Tests
      run: |
        # Wait for services to be ready
        kubectl wait --for=condition=ready pod -l app=pethome-backend --timeout=300s
        kubectl wait --for=condition=ready pod -l app=pethome-frontend --timeout=300s

        # Run smoke tests
        curl -f http://staging-api.pethome.com/actuator/health
        curl -f http://staging-www.pethome.com

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Deploy to Production
      uses: azure/k8s-deploy@v3
      with:
        namespace: pethome
        manifests: |
          k8s-deployment.yaml
        images: |
          ghcr.io/${{ github.repository }}/pethome-backend:latest
          ghcr.io/${{ github.repository }}/pethome-frontend:latest
        imagepullsecrets: |
          ghcr.io

    - name: Health Check
      run: |
        # Blue-green deployment verification
        kubectl rollout status deployment/pethome-backend --timeout=300s
        kubectl rollout status deployment/pethome-frontend --timeout=300s

        # Verify external endpoints
        curl -f https://api.pethome.com/actuator/health
        curl -f https://www.pethome.com

    - name: Slack Notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    if: failure()
    runs-on: ubuntu-latest
    steps:
    - name: Rollback Deployment
      uses: azure/k8s-rollback@v2
      with:
        namespace: pethome
        deployment: pethome-backend,pethome-frontend
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

notifications:
  email:
    recipients:
    - devops@pethome.com
    on_success: never
    on_failure: always