server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pethome_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: admin
      password: admin
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: mySuperSecretKeyForJwtSigningWhichShouldBeAtLeast32CharsLong123
  expiration: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.pethome: DEBUG

# AI 配置（未设置 API Key 时跳过真实调用，便于本地开发）
ai:
  claude:
    api-key: ${CLAUDE_API_KEY:${ANTHROPIC_API_KEY:}}
    model: ${AI_MODEL:claude-3-haiku-20240307}
    max-tokens: 1024
    temperature: 0.7
